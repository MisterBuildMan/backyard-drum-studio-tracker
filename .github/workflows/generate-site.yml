name: Generate Site

on:
  # Triggered by source repository webhook
  repository_dispatch:
    types: [source-updated]
  
  # Manual trigger for testing
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Source repo branch/ref to build from'
        default: 'main'
        required: false

# Required for OIDC authentication with AWS
permissions:
  id-token: write
  contents: write
  pages: write

jobs:
  generate:
    runs-on: ubuntu-latest
    
    steps:
      - name: Log trigger event
        run: |
          echo "🚀 Site generation triggered"
          echo "Timestamp: $(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          echo "Event: ${{ github.event_name }}"
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "Source commit: ${{ github.event.client_payload.sha }}"
          fi

      - name: Checkout tracker repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Clone source repository
        run: |
          SOURCE_REF="${{ github.event.inputs.source_ref || 'main' }}"
          echo "Cloning source repo at ref: $SOURCE_REF"
          git clone --depth 1 --branch "$SOURCE_REF" \
            https://github.com/${{ vars.SOURCE_REPO || 'MisterBuildMan/backyard-drum-studio' }}.git \
            source-repo

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Generate website
        run: node src/index.js source-repo
        env:
          DEBUG: 'true'

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          commit_message: 'Generated site: ${{ github.run_id }}'

      - name: Summary
        run: |
          echo "## ✅ Site Generated Successfully" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Trigger**: ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Run ID**: ${{ github.run_id }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Timestamp**: $(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "The site will be available at your GitHub Pages URL shortly." >> $GITHUB_STEP_SUMMARY

  notify-failure:
    runs-on: ubuntu-latest
    needs: generate
    if: failure()
    steps:
      - name: Report failure
        run: |
          echo "## ❌ Site Generation Failed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Check the workflow logs for details." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Run ID**: ${{ github.run_id }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Timestamp**: $(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> $GITHUB_STEP_SUMMARY
